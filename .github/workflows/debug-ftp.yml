name: Debug FTP Structure
on:
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  debug-ftp:
    name: Debug FTP directory structure
    runs-on: ubuntu-latest
    steps:
      - name: Install lftp
        run: sudo apt-get install -y lftp
      - name: List FTP directory structure
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set ftp:ssl-allow yes;
            set ftp:ssl-force yes;
            set ssl:verify-certificate no;
            set net:timeout 30;
            set net:max-retries 3;
            open -u '$FTP_USER','$FTP_PASS' ftp://$FTP_HOST;
            echo '=== FTP ROOT (/) ===';
            ls /;
            echo '=== PWD ===';
            pwd;
            echo '=== Looking for public_html ===';
            ls /public_html/ 2>/dev/null || echo 'No /public_html/';
            echo '=== Looking for website_7b890dc7 ===';
            ls /website_7b890dc7/ 2>/dev/null || echo 'No /website_7b890dc7/';
            echo '=== Looking for assets in root ===';
            ls /assets/ 2>/dev/null || echo 'No /assets/ at root';
          "
