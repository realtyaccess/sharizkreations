name: Build & Deploy to Bluehost
on:
  push:
    branches:
      - main
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build-and-deploy:
    name: Build React app and FTP deploy to Bluehost
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Inject cache-bust timestamp into index.html
        run: |
          BUILD_TS=$(date +%s)
          sed -i "s|\.js\">|.js?v=${BUILD_TS}\">|g" dist/public/index.html
          sed -i "s|\.css\">|.css?v=${BUILD_TS}\">|g" dist/public/index.html
          sed -i "s|\.js\" crossorigin|.js?v=${BUILD_TS}\" crossorigin|g" dist/public/index.html
          sed -i "s|\.css\" crossorigin|.css?v=${BUILD_TS}\" crossorigin|g" dist/public/index.html
          echo "Cache-bust timestamp: ${BUILD_TS}"
          grep -o 'index-[A-Za-z0-9]*\.[jc][ss][^"]*' dist/public/index.html
      - name: Install lftp
        run: sudo apt-get install -y lftp
      - name: Deploy via FTP (using Python script for reliable uploads)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 << 'PYEOF'
          import ftplib
          import os
          import ssl

          host = os.environ['FTP_HOST']
          user = os.environ['FTP_USER']
          password = os.environ['FTP_PASS']
          remote_dir = '/website-7b890dc7.esa.cun.mybluehost.me/shariz'
          local_dir = 'dist/public'

          print(f"Connecting to {host}...")

          # Create SSL context that doesn't verify certificate
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE

          ftp = ftplib.FTP_TLS(context=ctx)
          ftp.connect(host, 21, timeout=60)
          ftp.auth()
          ftp.login(user, password)
          ftp.prot_p()  # Switch to protected data channel
          ftp.set_pasv(True)

          print(f"Connected! Logged in as {user}")

          def delete_remote_dir(ftp, path):
              """Recursively delete a remote directory"""
              try:
                  items = []
                  ftp.retrlines(f'LIST {path}', items.append)
                  for item in items:
                      parts = item.split()
                      if not parts:
                          continue
                      name = parts[-1]
                      if name in ('.', '..'):
                          continue
                      full_path = f"{path}/{name}"
                      if item.startswith('d'):
                          delete_remote_dir(ftp, full_path)
                          try:
                              ftp.rmd(full_path)
                              print(f"  Removed dir: {full_path}")
                          except:
                              pass
                      else:
                          try:
                              ftp.delete(full_path)
                              print(f"  Deleted: {full_path}")
                          except Exception as e:
                              print(f"  Warning: could not delete {full_path}: {e}")
              except Exception as e:
                  print(f"  Note: {path} - {e}")

          def ensure_remote_dir(ftp, path):
              """Create remote directory if it doesn't exist"""
              try:
                  ftp.mkd(path)
              except:
                  pass  # Already exists

          def upload_dir(ftp, local_path, remote_path):
              """Upload a local directory to remote"""
              ensure_remote_dir(ftp, remote_path)
              for item in os.listdir(local_path):
                  local_item = os.path.join(local_path, item)
                  remote_item = f"{remote_path}/{item}"
                  if os.path.isdir(local_item):
                      upload_dir(ftp, local_item, remote_item)
                  else:
                      with open(local_item, 'rb') as f:
                          ftp.storbinary(f'STOR {remote_item}', f)
                          print(f"  Uploaded: {remote_item}")

          print(f"\nStep 1: Cleaning old files from {remote_dir}...")
          delete_remote_dir(ftp, remote_dir)

          print(f"\nStep 2: Uploading new build to {remote_dir}...")
          upload_dir(ftp, local_dir, remote_dir)

          ftp.quit()
          print("\nDeploy complete!")
          PYEOF
