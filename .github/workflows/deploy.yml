name: Build & Deploy to Bluehost via cPanel Git
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    name: Build React app and trigger cPanel deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Strip Manus runtime from index.html (clean for production)
        run: python3 scripts/prepare-deploy.py

      - name: Commit built files to repo
        run: |
          git config user.name "ShaRiz Deploy"
          git config user.email "deploy@sharizkreations.com"
          git add -f dist/public/
          if git diff --staged --quiet; then
            echo "No changes to built files — skipping commit"
          else
            git commit -m "chore: update built files [skip ci]"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
            echo "Built files committed and pushed"
          fi

      - name: Trigger cPanel Git pull via API
        run: |
          echo "=== Triggering cPanel Git pull ==="
          CPANEL_USER="${{ secrets.CPANEL_USER }}"
          CPANEL_TOKEN="${{ secrets.CPANEL_TOKEN }}"
          CPANEL_HOST="box2324.bluehost.com"
          if [ -z "$CPANEL_TOKEN" ]; then
            echo "CPANEL_TOKEN not set — skipping cPanel trigger"
            echo "Please add CPANEL_USER and CPANEL_TOKEN secrets to enable auto-deploy"
            exit 0
          fi
          RESPONSE=$(curl -sk \
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
            "https://${CPANEL_HOST}:2083/execute/VersionControlDeployment/create?repository_root=%2Fhome2%2Fesacunmy%2Fsharizkreations-repo" \
            2>&1)
          echo "cPanel response: $RESPONSE"
          echo "Deploy triggered!"
