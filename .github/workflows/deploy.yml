name: Build & Deploy to Bluehost
on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    name: Build React app and deploy via cPanel Git
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Commit built files to repo
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          # Remove dist/public from .gitignore so we can commit it
          git rm -r --cached dist/public/ 2>/dev/null || true
          git add -f dist/public/
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to built files — skipping commit"
          else
            git commit -m "chore: update built files [skip ci]"
            git push origin main
            echo "Built files committed and pushed"
          fi

      - name: Trigger cPanel Git pull
        env:
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
        run: |
          echo "=== Triggering cPanel Git pull ==="
          RESPONSE=$(curl -sk -H "Authorization: cpanel $CPANEL_USER:$CPANEL_TOKEN" \
            "https://$CPANEL_HOST:2083/execute/VersionControl/retrieve_repositories" \
            2>&1)
          echo "Repositories: $RESPONSE" | python3 -c "
          import json, sys
          data = sys.stdin.read()
          start = data.find('{')
          if start >= 0:
              try:
                  obj = json.loads(data[start:])
                  repos = obj.get('data', {}).get('repositories', [])
                  for r in repos:
                      print('Repo:', r.get('repository_root','?'), '| Branch:', r.get('branch','?'))
              except:
                  print('Raw:', data[:500])
          " || echo "Could not parse response"
