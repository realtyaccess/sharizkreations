name: Build & Deploy to Bluehost

# Trigger: every push to main branch
on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    name: Build React app and FTP deploy to Bluehost
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install pnpm (version read from package.json packageManager field)
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # 3. Set up Node.js 22
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      # 4. Install dependencies
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # 5. Build the production bundle (outputs to dist/public/)
      - name: Build
        run: pnpm build

      # 6. Cache-bust: inject build timestamp into index.html so LiteSpeed
      #    and any CDN always serve the freshest version on every deploy.
      - name: Inject cache-bust timestamp into index.html
        run: |
          BUILD_TS=$(date +%s)
          sed -i "s|\.js\">|.js?v=${BUILD_TS}\">|g" dist/public/index.html
          sed -i "s|\.css\">|.css?v=${BUILD_TS}\">|g" dist/public/index.html
          sed -i "s|\.js\" crossorigin|.js?v=${BUILD_TS}\" crossorigin|g" dist/public/index.html
          sed -i "s|\.css\" crossorigin|.css?v=${BUILD_TS}\" crossorigin|g" dist/public/index.html
          echo "Cache-bust timestamp: ${BUILD_TS}"

      # 7. Deploy dist/public/ to Bluehost via explicit FTPS (port 21)
      #    Using dangerous-clean-slate=true to force a FULL re-upload every time,
      #    ensuring Bluehost always has exactly what was just built — no stale files.
      - name: Deploy via FTP to Bluehost (full clean upload)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./dist/public/
          server-dir: /public_html/
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/*.map
