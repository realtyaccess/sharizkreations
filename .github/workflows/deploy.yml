name: Build & Deploy to Bluehost
on:
  push:
    branches:
      - main
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build-and-deploy:
    name: Build React app and FTP deploy to Bluehost
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Inject cache-bust timestamp into index.html
        run: |
          BUILD_TS=$(date +%s)
          sed -i "s|\.js\">|.js?v=${BUILD_TS}\">|g" dist/public/index.html
          sed -i "s|\.css\">|.css?v=${BUILD_TS}\">|g" dist/public/index.html
          sed -i "s|\.js\" crossorigin|.js?v=${BUILD_TS}\" crossorigin|g" dist/public/index.html
          sed -i "s|\.css\" crossorigin|.css?v=${BUILD_TS}\" crossorigin|g" dist/public/index.html
          echo "Cache-bust timestamp: ${BUILD_TS}"
          grep -o 'index-[A-Za-z0-9]*\.[jc][ss][^"]*' dist/public/index.html
      - name: Deploy via FTP to Bluehost
        # FTP sub-account home: /home2/esacunmy/website-7b890dc7.esa.cun.mybluehost.me/
        # Web root for sharizkreations.com: /home2/esacunmy/website-7b890dc7.esa.cun.mybluehost.me/shariz/
        # FTP relative path: /shariz/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/public/
          server-dir: /shariz/
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/*.map
