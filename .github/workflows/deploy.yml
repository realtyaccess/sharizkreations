name: Build & Deploy to Bluehost
on:
  push:
    branches:
      - main
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build-and-deploy:
    name: Build React app and FTP deploy to Bluehost
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Inject cache-bust timestamp into index.html
        run: |
          BUILD_TS=$(date +%s)
          sed -i "s|\.js\">|.js?v=${BUILD_TS}\">|g" dist/public/index.html
          sed -i "s|\.css\">|.css?v=${BUILD_TS}\">|g" dist/public/index.html
          sed -i "s|\.js\" crossorigin|.js?v=${BUILD_TS}\" crossorigin|g" dist/public/index.html
          sed -i "s|\.css\" crossorigin|.css?v=${BUILD_TS}\" crossorigin|g" dist/public/index.html
          echo "Cache-bust timestamp: ${BUILD_TS}"
          echo "index.html script tags:"
          grep -o 'index-[A-Za-z0-9]*\.[jc][ss][^"]*' dist/public/index.html
      - name: Install lftp for FTP operations
        run: sudo apt-get install -y lftp
      - name: Clean remote directory and deploy fresh build
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          # CONFIRMED via cPanel File Manager:
          # Full server path: /home2/esacunmy/website-7b890dc7.esa.cun.mybluehost.me/shariz
          # FTP root maps to /home2/esacunmy/ so FTP path is: /website-7b890dc7.esa.cun.mybluehost.me/shariz/
          lftp -c "
            set ftp:ssl-allow yes;
            set ftp:ssl-force yes;
            set ssl:verify-certificate no;
            set net:timeout 60;
            set net:max-retries 5;
            set net:reconnect-interval-base 5;
            set net:reconnect-interval-multiplier 1;
            open -u '$FTP_USER','$FTP_PASS' ftp://$FTP_HOST;
            echo 'Connected to Bluehost FTP';
            echo 'Step 1: Deleting old assets from /website-7b890dc7.esa.cun.mybluehost.me/shariz/...';
            rm -rf /website-7b890dc7.esa.cun.mybluehost.me/shariz/assets;
            rm -f /website-7b890dc7.esa.cun.mybluehost.me/shariz/index.html;
            rm -f /website-7b890dc7.esa.cun.mybluehost.me/shariz/.htaccess;
            rm -rf /website-7b890dc7.esa.cun.mybluehost.me/shariz/__manus__;
            echo 'Step 2: Uploading new build to /website-7b890dc7.esa.cun.mybluehost.me/shariz/...';
            mirror --reverse --verbose --parallel=5 --exclude=index.html dist/public/ /website-7b890dc7.esa.cun.mybluehost.me/shariz/;
            echo 'Step 3: Uploading index.html last...';
            put -O /website-7b890dc7.esa.cun.mybluehost.me/shariz/ dist/public/index.html;
            echo 'Deploy complete!';
          "
