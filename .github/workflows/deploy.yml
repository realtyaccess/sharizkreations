name: Build & Deploy to Bluehost

# Trigger: every push to main branch
on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    name: Build React app and FTP deploy to Bluehost
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install pnpm (version read from package.json packageManager field)
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # 3. Set up Node.js 22
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      # 4. Install dependencies
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # 5. Build the production bundle (outputs to dist/public/)
      - name: Build
        run: pnpm build

      # 6. Deploy dist/public/ to Bluehost via explicit FTPS (port 21)
      #    Secrets required in GitHub → Settings → Secrets → Actions:
      #      FTP_HOST     = ftp.esa.cun.mybluehost.me
      #      FTP_USERNAME = SHARIZ@website-7b890dc7.esa.cun.mybluehost.me
      #      FTP_PASSWORD = your Bluehost/cPanel password
      - name: Deploy via FTP to Bluehost
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./dist/public/
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/*.map
