name: Build & Deploy to Bluehost

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    name: Build React app and FTP deploy to Bluehost
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Inject cache-bust timestamp into index.html
        run: |
          BUILD_TS=$(date +%s)
          sed -i "s|\.js\">|.js?v=${BUILD_TS}\">|g" dist/public/index.html
          sed -i "s|\.css\">|.css?v=${BUILD_TS}\">|g" dist/public/index.html
          sed -i "s|\.js\" crossorigin|.js?v=${BUILD_TS}\" crossorigin|g" dist/public/index.html
          sed -i "s|\.css\" crossorigin|.css?v=${BUILD_TS}\" crossorigin|g" dist/public/index.html
          echo "Cache-bust timestamp: ${BUILD_TS}"
          echo "index.html script tags:"
          grep -o 'index-[A-Za-z0-9]*\.[jc][ss][^"]*' dist/public/index.html

      - name: Install lftp for FTP operations
        run: sudo apt-get install -y lftp

      - name: Clean remote directory and deploy fresh build
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          # Use lftp to delete all files in the remote directory and upload fresh build
          lftp -c "
            set ftp:ssl-allow yes;
            set ftp:ssl-force yes;
            set ssl:verify-certificate no;
            set net:timeout 30;
            set net:max-retries 3;
            open -u '$FTP_USER','$FTP_PASS' ftp://$FTP_HOST;
            echo 'Connected to Bluehost FTP';
            echo 'Step 1: Deleting old assets and index.html...';
            rm -rf /public_html/assets;
            rm -f /public_html/index.html;
            rm -f /public_html/.htaccess;
            rm -rf /public_html/__manus__;
            echo 'Step 2: Uploading assets and static files...';
            mirror --reverse --verbose --parallel=5 --exclude=index.html dist/public/ /public_html/;
            echo 'Step 3: Force uploading index.html last (ensures it is always fresh)...';
            put -O /public_html/ dist/public/index.html;
            echo 'Deploy complete! index.html uploaded last.';
          "
