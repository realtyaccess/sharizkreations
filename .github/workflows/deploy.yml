name: Build & Deploy to Bluehost
on:
  push:
    branches:
      - main
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build-and-deploy:
    name: Build React app and FTP deploy to Bluehost
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy via FTP (active mode - bypasses passive port firewall)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          # Web root for sharizkreations.com (confirmed via cPanel File Manager):
          # Full path: /home2/esacunmy/website-7b890dc7.esa.cun.mybluehost.me/shariz/
          # FTP sub-account home = /home2/esacunmy/
          # Relative FTP path = /website-7b890dc7.esa.cun.mybluehost.me/shariz/
          #
          # Using ACTIVE mode (passive-mode no) to bypass Bluehost passive port firewall.
          # Active mode: GitHub runner opens a local port, Bluehost connects back to it.
          # This avoids the blocked passive port range entirely.

          cat > /tmp/deploy.lftp << 'LFTPEOF'
set ftp:ssl-allow yes
set ftp:ssl-force yes
set ssl:verify-certificate no
set ftp:passive-mode no
set net:timeout 60
set net:max-retries 3
set net:reconnect-interval-base 5
LFTPEOF

          # Append credentials (separate to avoid quoting issues with special chars)
          echo "open -u \"$FTP_USER\",\"$FTP_PASS\" ftp://$FTP_HOST" >> /tmp/deploy.lftp

          cat >> /tmp/deploy.lftp << 'LFTPEOF'
echo "=== Connected to Bluehost FTP (active mode) ==="
echo "=== Cleaning old files from web root ==="
rm -rf /website-7b890dc7.esa.cun.mybluehost.me/shariz/assets
rm -f /website-7b890dc7.esa.cun.mybluehost.me/shariz/index.html
rm -f /website-7b890dc7.esa.cun.mybluehost.me/shariz/.htaccess
rm -rf /website-7b890dc7.esa.cun.mybluehost.me/shariz/__manus__
echo "=== Uploading new build ==="
mirror --reverse --verbose --parallel=3 dist/public/ /website-7b890dc7.esa.cun.mybluehost.me/shariz/
echo "=== Deploy complete! ==="
LFTPEOF

          echo "=== lftp script ==="
          cat /tmp/deploy.lftp
          echo "=== Running lftp ==="
          lftp -f /tmp/deploy.lftp
