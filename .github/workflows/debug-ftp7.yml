name: Debug FTP State File
on:
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  debug-ftp7:
    name: Read FTP deploy state files
    runs-on: ubuntu-latest
    steps:
      - name: Install lftp
        run: sudo apt-get install -y lftp
      - name: Read state files
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set ftp:ssl-allow yes;
            set ftp:ssl-force yes;
            set ssl:verify-certificate no;
            set net:timeout 30;
            set net:max-retries 3;
            open -u '$FTP_USER','$FTP_PASS' ftp://$FTP_HOST;
            echo '=== /public_html/.ftp-deploy-sync-state.json ===';
            cat /public_html/.ftp-deploy-sync-state.json;
            echo '';
            echo '=== /public_html/website_7b890dc7/.ftp-deploy-sync-state.json ===';
            cat /public_html/website_7b890dc7/.ftp-deploy-sync-state.json;
            echo '';
            echo '=== /.ftp-deploy-sync-state.json ===';
            cat /.ftp-deploy-sync-state.json 2>/dev/null || echo 'Not found';
            echo '=== All files in FTP root ===';
            ls -la /;
          "
